name: Build macOS App
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pygame pyinstaller
      - run: |
          pyinstaller --onefile --clean --collect-all numpy --add-data "music.mp3:." --name TulipGarden tulip_garden.py
      - run: |
          cd dist && zip -r ../TulipGarden-macOS.zip TulipGarden
      - uses: actions/upload-artifact@v4
        with:
          name: TulipGarden-macOS
          path: TulipGarden-macOS.zip